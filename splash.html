<!DOCTYPE html>
<html lang="fr">
<head>




    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet | Choisissez votre défi</title>
    <style>
        :root {
            --tri-color: #004c97;
            --run-color: #D65F3A;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* --- HEADER --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 0;
            text-align: center;
        }

        header p {
            color: var(--white);
            margin: 0;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        header strong {
    font-weight: 900; /* Gras maximum pour ressortir */
    color: #ffffff;   /* Blanc pur */
    text-shadow: 0 0 10px rgba(0,0,0,0.3); /* Optionnel : une légère ombre pour garantir la lisibilité sur les zones claires */
}

        /* --- CONTAINER SPLIT --- */
        .splash-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        /* IMAGE DE FOND */
        .side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('banniere-split.jpg'); /* Ton nouveau nom de fichier */
            background-size: cover;
            filter: grayscale(20%) brightness(0.45);
            transition: all 0.8s ease;
            z-index: 1;
        }

        .side-tri::before { background-position: left center; }
        .side-run::before { background-position: right center; }

        /* CONTENU */
        .content {
            position: relative;
            z-index: 2;
            color: var(--white);
            padding: 40px;
            width: 100%;
            max-width: 320px;
            transition: transform 0.5s ease;
        }

        .logo-img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }

        .content p {
            font-size: 0.95rem;
            margin-top: 0;
            opacity: 0.8;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            border: 2px solid var(--white);
            color: var(--white);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* INTERACTIONS SURVOL */
        .side:hover { flex: 1.4; }
        .side:hover::before { filter: grayscale(0%) brightness(0.7) scale(1.05); }
        .side:hover .content { transform: scale(1.05); }

        .side-tri:hover .btn { background: var(--tri-color); border-color: var(--tri-color); }
        .side-run:hover .btn { background: var(--run-color); border-color: var(--run-color); }

        /* OPTIMISATION MOBILE */
        /* OPTIMISATION MOBILE */
@media (max-width: 834px) {
    /* Le header n'est plus absolu, il prend sa place naturelle en haut */
    header {
        position: relative; /* Change d'absolute à relative */
        background: #000;   /* Fond noir solide pour une séparation nette */
        padding: 15px 0;
        backdrop-filter: none;
        border-bottom: 2px solid #333;
    }

    header p { 
        font-size: 0.7rem; 
        padding: 0 15px; 
        line-height: 1.4; 
    }
    
    /* La splash-container ne fait plus 100vh pour laisser la place au header sans scroll */
    .splash-container { 
        flex-direction: column;
        height: calc(100vh - 60px); /* 100% de la hauteur moins la taille du header */
    }
    
    .side {
        flex: 1;
        width: 100vw;
    }

    /* Reset des ajustements de padding précédents car il n'y a plus d'overlap */
    .side-tri {
        padding-top: 0; 
    }

    /* Focus sur les sujets sportifs */
    .side-tri::before { 
        background-position: 20% center !important; 
        height: 100%;
        top: 0;
    }

    .side-run::before { 
        background-position: 85% center !important; 
    }

    /* Ajustement des logos et boutons pour petits écrans */
    .logo-img { 
        max-width: 190px; 
    }
    
    .content { 
        padding: 20px; 
    }
    
    .btn { 
        margin-top: 15px; 
        padding: 10px 25px; 
        font-size: 0.75rem;
    }
}
    </style>
</head>
<body>

    <header>
    <p>Organisme spécialisé en <strong>Coaching & Mentorat Sportif</strong> au Québec</p>
</header>

    <div class="splash-container">
    <a href="javascript:void(0)" onclick="redirectProject('tri')" class="side side-tri">
        <div class="content">
            <img src="MPT_New_logo_white.png" alt="Coaching et club de triathlon Québec - Mon Projet Tri" class="logo-img">
            <p>Natation • Vélo • Course</p>
            <div class="btn">Accéder au site</div>
        </div>
    </a>

    <a href="javascript:void(0)" onclick="redirectProject('run')" class="side side-run">
        <div class="content">
            <img src="MPR_New_logo_white" alt="Programme d'entraînement course à pied - Mon Projet Run" class="logo-img">
            <p>Spécialiste Course à pied</p>
            <div class="btn">Accéder au site</div>
        </div>
    </a>
</div>

<script>
function redirectProject(project) {
    // On regarde toutes les langues préférées de l'utilisateur
    const languages = navigator.languages || [navigator.language || navigator.userLanguage];
    
    // On vérifie si le français est présent n'importe où dans la liste
    const hasFrench = languages.some(lang => lang.toLowerCase().startsWith('fr'));
    
    // On ne redirige vers l'anglais QUE si le français n'est pas là 
    // ET que l'anglais est présent.
    const hasEnglish = languages.some(lang => lang.toLowerCase().startsWith('en'));
    const shouldGoToEn = !hasFrench && hasEnglish;

    if (project === 'tri') {
        window.location.href = shouldGoToEn ? 'en/index.html' : 'index.html';
    } else if (project === 'run') {
        window.location.href = shouldGoToEn ? 'en/run.html' : 'course.html';
    }
}
</script>
</body>
</html>
