<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta SEO Essentielles -->
    <title>Mon Projet | Triathlon & Course à pied au Québec</title>
    <meta name="description" content="Organisme spécialisé en coaching et mentorat sportif au Québec. Choisissez votre défi : Mon Projet Tri (Triathlon) ou Mon Projet Run (Course à pied).">
    <link rel="canonical" href="https://mon.projet-tri.org/splash.html" />

    <!-- Open Graph (Réseaux Sociaux) -->
    <meta property="og:title" content="Mon Projet | Triathlon & Course à pied au Québec">
    <meta property="og:description" content="Organisme spécialisé en coaching et mentorat sportif au Québec. Choisissez votre défi.">
    <meta property="og:url" content="https://mon.projet-tri.org/splash.html">
    <meta property="og:type" content="website">

    <style>
        :root {
            --tri-color: #004c97;
            --run-color: #D65F3A;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* --- HEADER --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 0;
            text-align: center;
        }

        header p {
            color: var(--white);
            margin: 0;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        header strong {
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* --- CONTAINER SPLIT --- */
        .splash-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        /* IMAGE DE FOND */
        .side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('banniere-split.jpg');
            background-size: cover;
            filter: grayscale(20%) brightness(0.45);
            transition: all 0.8s ease;
            z-index: 1;
        }

        .side-tri::before { background-position: left center; }
        .side-run::before { background-position: right center; }

        /* CONTENU */
        .content {
            position: relative;
            z-index: 2;
            color: var(--white);
            padding: 40px;
            width: 100%;
            max-width: 320px;
            transition: transform 0.5s ease;
        }

        .logo-img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }

        .content p {
            font-size: 0.95rem;
            margin-top: 0;
            opacity: 0.8;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            border: 2px solid var(--white);
            color: var(--white);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* INTERACTIONS SURVOL */
        .side:hover { flex: 1.4; }
        .side:hover::before { filter: grayscale(0%) brightness(0.7) scale(1.05); }
        .side:hover .content { transform: scale(1.05); }

        .side-tri:hover .btn { background: var(--tri-color); border-color: var(--tri-color); }
        .side-run:hover .btn { background: var(--run-color); border-color: var(--run-color); }

        /* OPTIMISATION MOBILE */
        @media (max-width: 834px) {
            header {
                position: relative;
                background: #000;
                padding: 15px 0;
                backdrop-filter: none;
                border-bottom: 2px solid #333;
            }

            header p { 
                font-size: 0.7rem; 
                padding: 0 15px; 
                line-height: 1.4; 
            }
            
            .splash-container { 
                flex-direction: column;
                height: calc(100vh - 60px);
            }
            
            .side {
                flex: 1;
                width: 100vw;
            }

            .side-tri {
                padding-top: 0; 
            }

            .side-tri::before { 
                background-position: 20% center !important; 
                height: 100%;
                top: 0;
            }

            .side-run::before { 
                background-position: 85% center !important; 
            }

            .logo-img { 
                max-width: 190px; 
            }
            
            .content { 
                padding: 20px; 
            }
            
            .btn { 
                margin-top: 15px; 
                padding: 10px 25px; 
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <p>Organisme spécialisé en <strong>Coaching & Mentorat Sportif</strong> au Québec</p>
    </header>

    <div class="splash-container">
        <!-- Lien vers la version FR par défaut pour les robots, interception JS pour les humains -->
        <a href="index.html" onclick="redirectProject(event, 'tri')" class="side side-tri">
            <div class="content">
                <img src="MPT_New_logo_white.png" alt="Coaching et club de triathlon Québec - Mon Projet Tri" class="logo-img">
                <p>Natation • Vélo • Course</p>
                <div class="btn">Accéder au site</div>
            </div>
        </a>

        <!-- Lien vers la version FR par défaut pour les robots, interception JS pour les humains -->
        <a href="course.html" onclick="redirectProject(event, 'run')" class="side side-run">
            <div class="content">
                <img src="MPR_New_logo_white.png" alt="Programme d'entraînement course à pied - Mon Projet Run" class="logo-img">
                <p>Spécialiste Course à pied</p>
                <div class="btn">Accéder au site</div>
            </div>
        </a>
    </div>

<script>
function redirectProject(event, project) {
    // Empêche la redirection HTML par défaut pour exécuter la logique de détection de langue
    if (event) {
        event.preventDefault();
    }

    const languages = navigator.languages || [navigator.language || navigator.userLanguage];
    
    const hasFrench = languages.some(lang => lang.toLowerCase().startsWith('fr'));
    const hasEnglish = languages.some(lang => lang.toLowerCase().startsWith('en'));
    const shouldGoToEn = !hasFrench && hasEnglish;

    if (project === 'tri') {
        window.location.href = shouldGoToEn ? 'en/index.html' : 'index.html';
    } else if (project === 'run') {
        window.location.href = shouldGoToEn ? 'en/run.html' : 'course.html';
    }
}
</script>
</body>
</html>
