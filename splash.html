<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet | Choisissez votre défi</title>
    <style>
        :root {
            --tri-color: #004c97;
            --run-color: #D65F3A;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        .splash-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Division de l'écran */
        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        /* Image de fond (votre bannière split) */
        .side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('banniere-split.jpg'); /* Remplacez par votre fichier */
            background-size: cover;
            background-position: center;
            filter: grayscale(30%) brightness(0.5);
            transition: all 0.7s ease;
            z-index: 1;
        }

        .side-tri::before { background-position: left center; }
        .side-run::before { background-position: right center; }

        /* Contenu textuel et Logos */
        .content {
            position: relative;
            z-index: 2;
            color: var(--white);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            transition: transform 0.5s ease;
        }

        .logo-img {
            width: 100%;
            max-width: 300px; /* Taille basée sur vos fichiers */
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .content p {
            font-size: 1.1rem;
            margin-top: 5px;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Boutons */
        .btn {
            display: inline-block;
            margin-top: 35px;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85rem;
            border: 2px solid var(--white);
            color: var(--white);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        /* Effets au survol */
        .side:hover { flex: 1.4; }
        .side:hover::before { filter: grayscale(0%) brightness(0.7) scale(1.05); }
        .side:hover .content { transform: scale(1.05); }

        /* Couleurs au survol pour les boutons */
        .side-tri:hover .btn { background: var(--tri-color); border-color: var(--tri-color); }
        .side-run:hover .btn { background: var(--run-color); border-color: var(--run-color); }

        /* Mobile */
        @media (max-width: 768px) {
    .splash-container { 
        flex-direction: column; 
    }
    .side {
        flex: 1; /* Chaque section prend exactement 50% de la hauteur de l'écran */
        width: 100vw;
    }
    .side::before {
        background-position: center !important; /* Recentrer l'image sur chaque sport */
    }
    .logo-img { 
        max-width: 180px; /* Plus petit pour laisser de la place au bouton */
    }
    .content { 
        padding: 10px; 
    }
    .btn {
        margin-top: 15px;
        padding: 10px 25px;
        font-size: 0.75rem;
    }
}



    </style>
</head>
<body>

    <div class="splash-container">
        <a href="index.html" class="side side-tri">
            <div class="content">
                <img src="MPT_Logo_White_text_300.png" alt="Mon Projet Tri" class="logo-img">
                <p>Natation • Vélo • Course</p>
                <div class="btn">Entrer sur le site</div>
            </div>
        </a>

        <a href="course.html" class="side side-run">
            <div class="content">
                <img src="MPR_Logo_White_text_300.png" alt="Mon Projet Run" class="logo-img">
                <p>Performance • Accompagnement</p>
                <div class="btn">Entrer sur le site</div>
            </div>
        </a>
    </div>

</body>
</html>
