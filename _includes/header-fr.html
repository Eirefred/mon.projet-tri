<!--
  EN-TÊTE COMMUN (pages françaises) — modifier ICI pour changer le menu sur toutes les pages.
  Variables lues dans l'en-tête de chaque page (entre les lignes ---) :
    section      : athletes | partenaires | coach   (met en évidence le bon menu déroulant)
    autre_langue : page anglaise équivalente (ex. en/guidance.html)
-->
<header>
    <div class="container nav-container">
        <div class="logo-area" style="display: flex; align-items: center; gap: 15px;">
            <div class="logo">
                <a href="index.html"><img src="MPT_New_logo_blue.png" alt="mon Projet Tri - Coaching et mentorat de triathlon au Québec"></a>
            </div>
            <div class="region-stack">
                <span class="region-mention">Partout au Québec</span>
            </div>
        </div>
        <nav>
            <input type="checkbox" id="menu-toggle" style="display: none;">
            <label for="menu-toggle" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-links">
                <li class="has-dropdown">
                    <a href="decouvrir.html" class="dropdown-trigger{% if page.section == 'partenaires' or page.url == '/decouvrir.html' %} active{% endif %}">La&nbsp;mission <span class="arrow-down">▼</span></a>
                    <button type="button" class="sous-menu-btn" aria-expanded="false" aria-label="Afficher les pages : La mission"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <ul class="dropdown-menu">
                        <li><a href="decouvrir.html"{% if page.url == '/decouvrir.html' %} class="active"{% endif %}>Notre mission</a></li>
                        <li><a href="devenir-partenaire.html"{% if page.url == '/devenir-partenaire.html' %} class="active"{% endif %}>Devenir partenaire</a></li>
                        <li class="menu-don-li"><a class="menu-don" href="https://www.zeffy.com/fr-CA/ticketing/programmes-de-mon-projet-tri" target="_blank" rel="noopener"><span class="coeur" aria-hidden="true">♥</span> Faire un don</a></li>
                    </ul>
                </li>
                <li class="has-dropdown">
                    <a href="index.html#athlètes" class="dropdown-trigger{% if page.section == 'athletes' %} active{% endif %}">Athlètes <span class="arrow-down">▼</span></a>
                    <button type="button" class="sous-menu-btn" aria-expanded="false" aria-label="Afficher les pages : Athlètes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <ul class="dropdown-menu">
                        <li class="menu-titre">Selon votre besoin</li>
                        <li><a href="autonome.html"{% if page.url == '/autonome.html' %} class="active"{% endif %}>Autonome</a></li>
                        <li><a href="accompagnement.html"{% if page.url == '/accompagnement.html' %} class="active"{% endif %}>Accompagnement</a></li>
                        <li><a href="club.html"{% if page.url == '/club.html' %} class="active"{% endif %}>Club</a></li>
                        <li class="menu-sep" role="separator"></li>
                        <li><a href="avantages.html"{% if page.url == '/avantages.html' %} class="active"{% endif %}>Bons plans</a></li>
                        <li><a href="votre-histoire.html"{% if page.url == '/votre-histoire.html' %} class="active"{% endif %}><i>Votre histoire</i></a></li>
                    </ul>
                </li>
                <li><a href="besoin-coach.html"{% if page.url == '/besoin-coach.html' %} class="active"{% endif %}>Coach&nbsp;ou&nbsp;pas&nbsp;?</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="calendrier.html">Calendrier'26</a></li>
                <li class="lang-switcher">
                    <span class="lang-label">FR</span>
                    <label class="switch">
                        <input type="checkbox" onclick="window.location.href='{{ page.autre_langue | default: 'en/index.html' }}'">
                        <span class="slider"></span>
                    </label>
                    <span class="lang-label" style="color: #ccc;">EN</span>
                </li>
            </ul>
        </nav>
    </div>
</header>

<style>
    /* Menu : évite le débordement sur tablette / petits écrans d'ordinateur (769 à 1100 px) */
    @media (min-width: 769px) and (max-width: 1100px) {
        header nav ul.nav-links { gap: 14px; }
        header nav ul.nav-links > li > a { font-size: 0.74rem; }
        header .region-stack { display: none; }
        header .logo img { height: 44px; }
    }
    @media (min-width: 769px) and (max-width: 900px) {
        header nav ul.nav-links { gap: 10px; }
        header nav ul.nav-links > li > a { font-size: 0.68rem; }
    }
    header .dropdown-menu a { white-space: nowrap; }
    /* Très petits téléphones : on masque la mention de région pour garder le menu dans l'écran */
    @media (max-width: 360px) { header .region-stack { display: none; } }
    /* Section « Partenaires » dans le menu La mission */
    header .dropdown-menu .menu-sep { height: 0; border-top: 1px solid #e2e8f0; margin: 6px 14px; padding: 0; width: auto; max-width: calc(100% - 28px); box-sizing: border-box; }
    header .dropdown-menu .menu-titre { padding: 6px 20px 2px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #94a3b8; cursor: default; }
    @media (max-width: 768px) {
        header .dropdown-menu .menu-sep { margin: 6px 0 4px 20px; width: 140px; }
        header .dropdown-menu .menu-titre { padding: 2px 0 0 20px; }
    }
    /* ===== MENU MOBILE (hamburger ouvert) : sections en accordéon ===== */
    header #menu-toggle:checked ~ .nav-links { align-items: stretch; padding: 6px 22px 22px; gap: 0; max-height: calc(100vh - 80px); overflow-y: auto; }
    header #menu-toggle:checked ~ .nav-links > li { width: 100%; border-bottom: 1px solid #e8eef5; position: relative; }
    header #menu-toggle:checked ~ .nav-links > li.lang-switcher { border-bottom: none; justify-content: center; padding-top: 16px; }
    header #menu-toggle:checked ~ .nav-links > li > a { display: flex; justify-content: space-between; align-items: center; padding: 15px 4px; font-size: 0.95rem; letter-spacing: 0.4px; }
    header #menu-toggle:checked ~ .nav-links > li:not(.has-dropdown) > a::after { content: "›"; font-size: 1.35rem; line-height: 1; color: #9fb3c8; font-weight: 400; }
    header #menu-toggle:checked ~ .nav-links > li.has-dropdown > a { padding-right: 56px; }
    header #menu-toggle:checked ~ .nav-links .arrow-down { display: none; }
    header #menu-toggle:checked ~ .nav-links li.has-dropdown:not(.ouvert) .dropdown-menu { display: none !important; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu { background: #f3f8fd; border-radius: 12px; padding: 4px 0; margin: 0 0 14px; border-left: 3px solid #4daad4; box-sizing: border-box; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; font-size: 1rem; font-weight: 600; text-transform: none; white-space: normal; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a:hover { padding-left: 16px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a::after { content: "›"; color: #9fb3c8; font-size: 1.2rem; line-height: 1; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li + li a { border-top: 1px solid #e3ecf5; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-sep { display: none; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-titre { padding: 12px 16px 2px; border-top: 1px solid #e3ecf5; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-titre + li a { border-top: none; }
    header .sous-menu-btn { display: none; }
    header #menu-toggle:checked ~ .nav-links .sous-menu-btn { display: inline-flex; align-items: center; justify-content: center; position: absolute; right: 0; top: 8px; width: 38px; height: 38px; border: none; border-radius: 50%; background: #e3f1fb; color: #004c97; cursor: pointer; padding: 0; }
    header .sous-menu-btn svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
    header li.ouvert > .sous-menu-btn svg { transform: rotate(180deg); }
    /* Pastilles flottantes masquées pendant que le menu mobile est ouvert */
    body:has(#menu-toggle:checked) .floating-badges-container, body:has(#menu-toggle:checked) .google-badge-float { display: none !important; }
    /* Lien « Faire un don » : discret (fond pêche très pâle, cœur orange) ; l'orange du texte reste réservé à la page active */
    header .dropdown-menu li.menu-don-li { border-top: 1px solid #eef2f7; margin-top: 4px; padding-top: 4px; }
    header .dropdown-menu a.menu-don { background: #fff6f2; }
    header .dropdown-menu a.menu-don .coeur { color: #D65F3A; }
    header .dropdown-menu a.menu-don:hover { background: #ffece4; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li.menu-don-li { margin-top: 0; padding-top: 0; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don { border-radius: 0 0 12px 0; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don { justify-content: flex-start; gap: 6px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don::after { margin-left: auto; }
    /* Athlètes : séparateur entre les formules (Autonome, Accompagnement, Club) et les autres sujets */
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li.menu-sep { display: block; height: 0; margin: 0; width: auto; max-width: none; border-top: 2px solid #c9dcef; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li.menu-sep + li a { border-top: none; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li.menu-titre:first-child { border-top: none; }
    header .dropdown-menu li.menu-titre:first-child { padding-top: 4px; }
    /* Menu mobile : un encadré séparé pour chaque groupe de liens (coupé au séparateur) */
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) { background: transparent; border-left: none; padding: 0; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li:not(.menu-sep) { background: #f3f8fd; border-left: 3px solid #4daad4; box-sizing: border-box; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li:first-child { border-radius: 12px 12px 0 0; padding-top: 4px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li:has(+ li.menu-sep) { border-radius: 0 0 12px 12px; padding-bottom: 4px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li.menu-sep + li { border-radius: 12px 12px 0 0; padding-top: 4px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li:last-child { border-radius: 0 0 12px 12px; padding-bottom: 4px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li.menu-sep { border-top: none; height: 10px; background: transparent; }
    /* 2e groupe (Vos avantages, Votre histoire) d'une teinte différente */
    header #menu-toggle:checked ~ .nav-links .dropdown-menu:has(li.menu-sep) > li.menu-sep ~ li { background: #f4f5f7; border-left-color: #a9b6c6; }
    /* Ordinateur : les deux groupes du menu Athlètes en deux teintes (bleu pâle, puis gris pâle) */
    header .dropdown-menu:has(li.menu-sep) { padding: 0 !important; overflow: hidden; }
    header .dropdown-menu:has(li.menu-sep) > li:not(.menu-sep) { background: #f3f8fd; }
    header .dropdown-menu:has(li.menu-sep) > li.menu-sep ~ li { background: #f4f5f7; }
    header .dropdown-menu:has(li.menu-sep) > li:first-child { padding-top: 8px; }
    header .dropdown-menu:has(li.menu-sep) > li:has(+ li.menu-sep) { padding-bottom: 6px; }
    header .dropdown-menu:has(li.menu-sep) > li.menu-sep + li { padding-top: 6px; }
    header .dropdown-menu:has(li.menu-sep) > li:last-child { padding-bottom: 8px; }
    header .dropdown-menu:has(li.menu-sep) > li.menu-sep { margin: 0; max-width: none; border-top: 1px solid #dfe5ec; }
</style>
<script>
    // Menu mobile : ouvre / ferme une section ; la section de la page en cours est ouverte d'office
    (function () {
        document.querySelectorAll('header li.has-dropdown').forEach(function (li) {
            var btn = li.querySelector('.sous-menu-btn');
            if (!btn) return;
            if (li.querySelector('a.active')) { li.classList.add('ouvert'); btn.setAttribute('aria-expanded', 'true'); }
            btn.addEventListener('click', function () {
                var ouvert = li.classList.toggle('ouvert');
                btn.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
            });
        });
    })();
</script>
