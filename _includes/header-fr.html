<!--
  EN-TÊTE COMMUN (pages françaises) — modifier ICI pour changer le menu sur toutes les pages.
  Variables lues dans l'en-tête de chaque page (entre les lignes ---) :
    section      : athletes | partenaires   (met en évidence le bon menu déroulant)
    autre_langue : page anglaise équivalente (ex. en/guidance.html)
-->
<header>
    <div class="container nav-container">
        <div class="logo-area" style="display: flex; align-items: center; gap: 15px;">
            <div class="logo">
                <a href="index.html"><img src="MPT_New_logo_blue.png" alt="mon Projet Tri - Coaching et mentorat de triathlon au Québec"></a>
            </div>
            <div class="region-stack">
                <span class="region-mention">Partout au Québec</span>
            </div>
        </div>
        <nav>
            <input type="checkbox" id="menu-toggle" style="display: none;">
            <label for="menu-toggle" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-links">
                <li><a href="decouvrir.html">La&nbsp;mission</a></li>
                <li class="has-dropdown">
                    <a href="index.html#athlètes" class="dropdown-trigger{% if page.section == 'athletes' %} active{% endif %}">Athlètes <span class="arrow-down">▼</span></a>
                    <ul class="dropdown-menu">
                        <li><a href="autonome.html"{% if page.url == '/autonome.html' %} class="active"{% endif %}>Autonome</a></li>
                        <li><a href="accompagnement.html"{% if page.url == '/accompagnement.html' %} class="active"{% endif %}>Accompagnement</a></li>
                        <li><a href="club.html"{% if page.url == '/club.html' %} class="active"{% endif %}>Club</a></li>
                        <li><a href="votre-histoire.html"{% if page.url == '/votre-histoire.html' %} class="active"{% endif %}><i>Votre histoire</i></a></li>
                    </ul>
                </li>
                <li class="has-dropdown">
                    <a href="index.html#partenaires" class="dropdown-trigger{% if page.section == 'partenaires' %} active{% endif %}">Partenaires <span class="arrow-down">▼</span></a>
                    <ul class="dropdown-menu">
                        <li><a href="recevoir.html"{% if page.url == '/recevoir.html' %} class="active"{% endif %}>Recevoir</a></li>
                        <li><a href="donner.html"{% if page.url == '/donner.html' %} class="active"{% endif %}>Donner</a></li>
                    </ul>
                </li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="calendrier.html">Calendrier'26</a></li>
                <li class="lang-switcher">
                    <span class="lang-label">FR</span>
                    <label class="switch">
                        <input type="checkbox" onclick="window.location.href='{{ page.autre_langue | default: 'en/index.html' }}'">
                        <span class="slider"></span>
                    </label>
                    <span class="lang-label" style="color: #ccc;">EN</span>
                </li>
            </ul>
        </nav>
    </div>
</header>
