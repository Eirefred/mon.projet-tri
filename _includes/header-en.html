<!--
  SHARED HEADER (English pages) — edit HERE to change the menu on every English page.
  Variables read from each page's front matter (between the --- lines):
    section      : athletes | partenaires | coach   (highlights the right dropdown)
    autre_langue : matching French page (e.g. ../accompagnement.html)
-->
<header>
    <div class="container nav-container">
        <div class="logo-area" style="display: flex; align-items: center; gap: 15px;">
            <div class="logo">
                <a href="index.html"><img src="../MPT_New_logo_blue.png" alt="mon Projet Tri (my Tri Project) - Triathlon coaching and mentorship in Quebec"></a>
            </div>
            <div class="region-stack">
                <span class="region-mention">Across Quebec</span>
            </div>
        </div>
        <nav>
            <input type="checkbox" id="menu-toggle" style="display: none;">
            <label for="menu-toggle" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-links">
                <li class="has-dropdown">
                    <a href="discover.html" class="dropdown-trigger{% if page.section == 'partenaires' or page.url == '/en/discover.html' %} active{% endif %}">Our&nbsp;Mission <span class="arrow-down">▼</span></a>
                    <button type="button" class="sous-menu-btn" aria-expanded="false" aria-label="Show pages: Our Mission"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <ul class="dropdown-menu">
                        <li><a href="discover.html"{% if page.url == '/en/discover.html' %} class="active"{% endif %}>Our mission</a></li>
                        <li><a href="become-a-partner.html"{% if page.url == '/en/become-a-partner.html' %} class="active"{% endif %}>Become a partner</a></li>
                        <li class="menu-don-li"><a class="menu-don" href="https://www.zeffy.com/fr-CA/ticketing/programmes-de-mon-projet-tri" target="_blank" rel="noopener"><span class="coeur" aria-hidden="true">♥</span> Make a donation</a></li>
                    </ul>
                </li>
                <li class="has-dropdown">
                    <a href="index.html#athlètes" class="dropdown-trigger{% if page.section == 'athletes' %} active{% endif %}">Athletes <span class="arrow-down">▼</span></a>
                    <button type="button" class="sous-menu-btn" aria-expanded="false" aria-label="Show pages: Athletes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <ul class="dropdown-menu">
                        <li><a href="independant.html"{% if page.url == '/en/independant.html' %} class="active"{% endif %}>Independant</a></li>
                        <li><a href="guidance.html"{% if page.url == '/en/guidance.html' %} class="active"{% endif %}>Guidance</a></li>
                        <li><a href="club.html"{% if page.url == '/en/club.html' %} class="active"{% endif %}>Club</a></li>
                        <li><a href="perks.html"{% if page.url == '/en/perks.html' %} class="active"{% endif %}>Perks</a></li>
                        <li><a href="your-story.html"{% if page.url == '/en/your-story.html' %} class="active"{% endif %}><i>Your story</i></a></li>
                    </ul>
                </li>
                <li><a href="need-a-coach.html"{% if page.url == '/en/need-a-coach.html' %} class="active"{% endif %}>Coach&nbsp;or&nbsp;not?</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="calendar.html">Calendar'26</a></li>
                <li class="lang-switcher">
                    <span class="lang-label" style="color: #ccc;">FR</span>
                    <label class="switch">
                        <input type="checkbox" checked onclick="window.location.href='{{ page.autre_langue | default: '../index.html' }}'">
                        <span class="slider"></span>
                    </label>
                    <span class="lang-label">EN</span>
                </li>
            </ul>
        </nav>
    </div>
</header>

<style>
    /* Menu : évite le débordement sur tablette / petits écrans d'ordinateur (769 à 1100 px) */
    @media (min-width: 769px) and (max-width: 1100px) {
        header nav ul.nav-links { gap: 14px; }
        header nav ul.nav-links > li > a { font-size: 0.74rem; }
        header .region-stack { display: none; }
        header .logo img { height: 44px; }
    }
    @media (min-width: 769px) and (max-width: 900px) {
        header nav ul.nav-links { gap: 10px; }
        header nav ul.nav-links > li > a { font-size: 0.68rem; }
    }
    header .dropdown-menu a { white-space: nowrap; }
    /* Très petits téléphones : on masque la mention de région pour garder le menu dans l'écran */
    @media (max-width: 360px) { header .region-stack { display: none; } }
    /* Section « Partenaires » dans le menu La mission */
    header .dropdown-menu .menu-sep { height: 0; border-top: 1px solid #e2e8f0; margin: 6px 14px; padding: 0; width: auto; max-width: calc(100% - 28px); box-sizing: border-box; }
    header .dropdown-menu .menu-titre { padding: 6px 20px 2px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #94a3b8; cursor: default; }
    @media (max-width: 768px) {
        header .dropdown-menu .menu-sep { margin: 6px 0 4px 20px; width: 140px; }
        header .dropdown-menu .menu-titre { padding: 2px 0 0 20px; }
    }
    /* ===== MENU MOBILE (hamburger ouvert) : sections en accordéon ===== */
    header #menu-toggle:checked ~ .nav-links { align-items: stretch; padding: 6px 22px 22px; gap: 0; max-height: calc(100vh - 80px); overflow-y: auto; }
    header #menu-toggle:checked ~ .nav-links > li { width: 100%; border-bottom: 1px solid #e8eef5; position: relative; }
    header #menu-toggle:checked ~ .nav-links > li.lang-switcher { border-bottom: none; justify-content: center; padding-top: 16px; }
    header #menu-toggle:checked ~ .nav-links > li > a { display: flex; justify-content: space-between; align-items: center; padding: 15px 4px; font-size: 0.95rem; letter-spacing: 0.4px; }
    header #menu-toggle:checked ~ .nav-links > li:not(.has-dropdown) > a::after { content: "›"; font-size: 1.35rem; line-height: 1; color: #9fb3c8; font-weight: 400; }
    header #menu-toggle:checked ~ .nav-links > li.has-dropdown > a { padding-right: 56px; }
    header #menu-toggle:checked ~ .nav-links .arrow-down { display: none; }
    header #menu-toggle:checked ~ .nav-links li.has-dropdown:not(.ouvert) .dropdown-menu { display: none !important; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu { background: #f3f8fd; border-radius: 12px; padding: 4px 0; margin: 0 0 14px; border-left: 3px solid #4daad4; box-sizing: border-box; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; font-size: 1rem; font-weight: 600; text-transform: none; white-space: normal; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a:hover { padding-left: 16px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a::after { content: "›"; color: #9fb3c8; font-size: 1.2rem; line-height: 1; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li + li a { border-top: 1px solid #e3ecf5; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-sep { display: none; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-titre { padding: 12px 16px 2px; border-top: 1px solid #e3ecf5; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu .menu-titre + li a { border-top: none; }
    header .sous-menu-btn { display: none; }
    header #menu-toggle:checked ~ .nav-links .sous-menu-btn { display: inline-flex; align-items: center; justify-content: center; position: absolute; right: 0; top: 8px; width: 38px; height: 38px; border: none; border-radius: 50%; background: #e3f1fb; color: #004c97; cursor: pointer; padding: 0; }
    header .sous-menu-btn svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
    header li.ouvert > .sous-menu-btn svg { transform: rotate(180deg); }
    /* Pastilles flottantes masquées pendant que le menu mobile est ouvert */
    body:has(#menu-toggle:checked) .floating-badges-container, body:has(#menu-toggle:checked) .google-badge-float { display: none !important; }
    /* "Make a donation" link: discreet (very pale peach background, orange heart); orange text stays reserved for the active page */
    header .dropdown-menu li.menu-don-li { border-top: 1px solid #eef2f7; margin-top: 4px; padding-top: 4px; }
    header .dropdown-menu a.menu-don { background: #fff6f2; }
    header .dropdown-menu a.menu-don .coeur { color: #D65F3A; }
    header .dropdown-menu a.menu-don:hover { background: #ffece4; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu li.menu-don-li { margin-top: 0; padding-top: 0; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don { border-radius: 0 0 12px 0; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don { justify-content: flex-start; gap: 6px; }
    header #menu-toggle:checked ~ .nav-links .dropdown-menu a.menu-don::after { margin-left: auto; }
</style>
<script>
    // Menu mobile : ouvre / ferme une section ; la section de la page en cours est ouverte d'office
    (function () {
        document.querySelectorAll('header li.has-dropdown').forEach(function (li) {
            var btn = li.querySelector('.sous-menu-btn');
            if (!btn) return;
            if (li.querySelector('a.active')) { li.classList.add('ouvert'); btn.setAttribute('aria-expanded', 'true'); }
            btn.addEventListener('click', function () {
                var ouvert = li.classList.toggle('ouvert');
                btn.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
            });
        });
    })();
</script>
