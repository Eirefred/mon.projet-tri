    
    <!-- BACK TO TOP BUTTON -->
    <button id="backToTop" title="Back to top">
        <svg viewBox="0 0 24 24">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backToTopBtn = document.getElementById("backToTop");

            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add("visible");
                } else {
                    backToTopBtn.classList.remove("visible");
                }
            });

            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        });

                // Highlight de la page active

document.addEventListener("DOMContentLoaded", function () {
        // 1. Récupère le nom de la page actuelle
        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        // 2. Parcourt tous les liens du header
        const navLinks = document.querySelectorAll(".nav-links a");

        navLinks.forEach(link => {
            const linkPage = link.getAttribute("href");

            // 3. Si le lien correspond à la page actuelle, on l'active !
            if (linkPage === currentPage || (currentPage === "" && linkPage === "index.html")) {
                link.classList.add("active");
            } else {
                link.classList.remove("active");
            }
        });
    });
    </script>
    <script>
    // ===== Onglets Mission / Genèse / Écosystème =====
    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        const btn = evt && evt.currentTarget ? evt.currentTarget : document.querySelector(`.tab-button[onclick*="${tabName}"]`);
        if (btn) {
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    }

    // Opens the right tab from the URL: discover.html#mission, #genese, #ecosysteme
    // (et #pour-athletes, #pour-coachs-clubs, etc. ouvrent la Mission puis défilent)
    function ouvrirDepuisAdresse() {
        const h = decodeURIComponent(location.hash.replace('#', ''));
        if (!h) return;
        if (['mission', 'genese', 'ecosysteme'].includes(h)) {
            openTab(null, 'tab-' + h);
            document.querySelector('.tabs-section').scrollIntoView({ behavior: 'smooth' });
        } else if (h.startsWith('pour-')) {
            openTab(null, 'tab-mission');
            const cible = document.getElementById(h);
            if (cible) setTimeout(() => cible.scrollIntoView({ behavior: 'smooth' }), 50);
        }
    }
    document.addEventListener('DOMContentLoaded', ouvrirDepuisAdresse);
    window.addEventListener('hashchange', ouvrirDepuisAdresse);
    </script>

    <script>
    // Mobile : réduit le logo interactif de l'écosystème pour qu'il tienne dans la largeur de l'écran
    (function () {
        function ajusterEcosysteme() {
            const vue = document.getElementById('ecoView');
            if (!vue) return;
            if (window.innerWidth > 834) { vue.style.transform = ''; vue.style.marginBottom = ''; vue.style.marginLeft = ''; return; }
            const dispo = vue.parentElement.clientWidth;
            if (!dispo) return; // onglet masqué : on recalcule à l'ouverture
            const echelle = Math.min(1, dispo / 620);
            vue.style.transform = 'scale(' + echelle + ')';
            vue.style.marginBottom = (vue.offsetHeight * (echelle - 1)) + 'px';
            vue.style.marginLeft = Math.max(0, (dispo - 620 * echelle) / 2) + 'px';
        }
        window.addEventListener('resize', ajusterEcosysteme);
        document.addEventListener('DOMContentLoaded', ajusterEcosysteme);
        document.querySelectorAll('.tab-button').forEach(b => b.addEventListener('click', () => setTimeout(ajusterEcosysteme, 0)));
        window.addEventListener('hashchange', () => setTimeout(ajusterEcosysteme, 60));
        setTimeout(ajusterEcosysteme, 100);
    })();
    </script>
