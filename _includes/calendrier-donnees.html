{%- comment -%}
  Données du calendrier lues par la page (calendrier.html et en/calendar.html).
  Jekyll les écrit à partir des fichiers _data/calendrier_2027.csv et _data/calendrier_2026.csv.
  Ne pas renommer ni réordonner les colonnes des fichiers CSV.
{%- endcomment -%}
<script>
    // Données du calendrier (générées depuis les fichiers CSV de _data/)
    const DONNEES_CAL = {
{%- assign annees = "2027,2026" | split: "," -%}
{%- for an in annees -%}
{%- assign cle = "calendrier_" | append: an -%}
{%- assign d = site.data[cle] %}
        {{ an }}: [{%- for r in d -%}{%- if forloop.first -%}[{%- for p in r -%}{{ p[0] | jsonify }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}],{%- endif -%}[{%- for p in r -%}{{ p[1] | jsonify }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]{%- unless forloop.last -%},{%- endunless -%}
{%- endfor %}
    };
</script>
