<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta SEO Essentielles -->
    <title>Plomberie & Chauffage | Installation, Dépannage et Expertise en France</title>
    <meta name="description" content="Entreprise spécialisée en plomberie et chauffage en France. Découvrez nos services : installation et dépannage à domicile, ou expertise et inspection technique.">
    <link rel="canonical" href="https://votre-domaine.fr/splash.html" />

    <!-- Open Graph (Réseaux Sociaux) -->
    <meta property="og:title" content="Plomberie & Chauffage | Installation, Dépannage & Expertise">
    <meta property="og:description" content="Plus de 30 ans d'expérience en plomberie et chauffage. Choisissez votre service : dépannage/installation ou expertise.">
    <meta property="og:url" content="https://votre-domaine.fr/splash.html">
    <meta property="og:type" content="website">

    <!-- Schema.org (Données structurées pour Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Plumber",
      "name": "Plomberie & Chauffage Expertise",
      "url": "https://votre-domaine.fr/splash.html",
      "description": "Entreprise spécialisée en travaux de plomberie, chauffage, dépannage, installation et expertise technique.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "FR"
      },
      "areaServed": "France"
    }
    </script>

    <style>
        :root {
            --tri-color: #004c97;
            --run-color: #D65F3A;
            --text-dark: #111111;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* --- HEADER --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 0;
            text-align: center;
        }

        /* H1 Optimisé SEO */
        header h1 {
            color: var(--white);
            margin: 0;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            opacity: 0.95;
        }

        header h1 strong {
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- CONTAINER SPLIT --- */
        .splash-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        /* IMAGE DE FOND */
        .side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('banniere-split.jpg');
            background-size: cover;
            filter: grayscale(10%) brightness(0.85);
            transition: all 0.8s ease;
            z-index: 1;
        }

        /* VOILE BLANC EN SURIMPRESSION */
        .side::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(2px);
            transition: all 0.5s ease;
            z-index: 2;
        }

        .side-tri::before { background-position: left center; }
        .side-run::before { background-position: right center; }

        /* CONTENU */
        .content {
            position: relative;
            z-index: 3;
            color: var(--text-dark);
            padding: 40px;
            width: 100%;
            max-width: 360px;
            transition: transform 0.5s ease;
            margin-top: 60px;
        }

        /* LOGOS : STYLE COMMUN */
        .logo-img {
            height: 110px; /* Hauteur de base pour matthieu-artisan.expertise.png */
            width: auto;   /* Conservation du ratio d'aspect */
            max-width: 90%;
            margin: 0 auto 20px auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0px 0px 12px rgba(255, 255, 255, 0.9)) drop-shadow(0px 4px 10px rgba(0,0,0,0.15));
        }

        /* AJUSTEMENT : LOGO SPECIALISTE (+10% PLUS GROS) */
        .side-tri .logo-img {
            height: 121px; /* 110px + 10% */
        }

        /* H2 Optimisés SEO avec texte foncé */
        .content h2 {
            font-size: 0.95rem;
            margin: 0;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            border: 2px solid var(--text-dark);
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* INTERACTIONS SURVOL */
        .side:hover { flex: 1.4; }
        .side:hover::before { filter: grayscale(0%) brightness(0.95) scale(1.05); }
        .side:hover::after { background: rgba(255, 255, 255, 0.25); }
        .side:hover .content { transform: scale(1.05); }

        .side-tri:hover .btn { background: var(--tri-color); border-color: var(--tri-color); color: var(--white); }
        .side-run:hover .btn { background: var(--run-color); border-color: var(--run-color); color: var(--white); }

        /* OPTIMISATION MOBILE */
        @media (max-width: 834px) {
            header {
                position: relative;
                background: #000;
                padding: 15px 0;
                backdrop-filter: none;
                border-bottom: 2px solid #333;
            }

            header h1 { 
                font-size: 0.75rem; 
                padding: 0 15px; 
                line-height: 1.4; 
            }
            
            .splash-container { 
                flex-direction: column;
                height: calc(100vh - 60px);
            }
            
            .side {
                flex: 1;
                width: 100vw;
            }

            .side-tri::before { 
                background-position: 20% center !important; 
            }

            .side-run::before { 
                background-position: 85% center !important; 
            }

            .logo-img { 
                height: 90px; 
            }

            .side-tri .logo-img {
                height: 99px; /* 90px + 10% sur mobile */
            }
            
            .content { 
                padding: 20px; 
                margin-top: 10px;
            }

            .content h2 {
                font-size: 0.85rem;
            }
            
            .btn { 
                margin-top: 15px; 
                padding: 10px 25px; 
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PLUS DE 30 ANS D'EXPÉRIENCE EN <strong>PLOMBERIE & CHAUFFAGE</strong></h1>
    </header>

    <div class="splash-container">
        <!-- Lien optimisé SEO - Dépannage & Installation -->
        <a href="index.html" onclick="redirectProject(event, 'specialiste')" class="side side-tri">
            <div class="content">
                <img src="matthieu-artisan.specialiste.png" alt="Plomberie & Chauffage - Dépannage et Installation" class="logo-img">
                <h2>INSTALLATION • DÉPANNAGE</h2>
                <div class="btn">Accéder au site</div>
            </div>
        </a>

        <!-- Lien optimisé SEO - Expertise & Inspection -->
        <a href="expertise.html" onclick="redirectProject(event, 'expertise')" class="side side-run">
            <div class="content">
                <img src="matthieu-artisan.expertise.png" alt="Plomberie & Chauffage - Expertise et Inspection" class="logo-img">
                <h2>EXPERTISE • INSPECTION</h2>
                <div class="btn">Accéder au site</div>
            </div>
        </a>
    </div>

<script>
function redirectProject(event, project) {
    if (event) {
        event.preventDefault();
    }

    const languages = navigator.languages || [navigator.language || navigator.userLanguage];
    
    const hasFrench = languages.some(lang => lang.toLowerCase().startsWith('fr'));
    const hasEnglish = languages.some(lang => lang.toLowerCase().startsWith('en'));
    const shouldGoToEn = !hasFrench && hasEnglish;

    if (project === 'specialiste') {
        window.location.href = shouldGoToEn ? 'specialiste.html' : 'index.html';
    } else if (project === 'expertise') {
        window.location.href = shouldGoToEn ? 'expertise.html' : 'expertise.html';
    }
}
</script>
</body>
</html>
