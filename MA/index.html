<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta SEO Essentielles -->
    <title>Plomberie & Chauffage | Installation, Dépannage et Expertise en France</title>
    <meta name="description" content="Entreprise familiale spécialisée en chauffage énergie bois en France. Découvrez nos services : installation et dépannage à domicile, ou expertise et inspection technique.">
    <link rel="canonical" href="https://mon.projet-tri.org/MA/index.html" />

    <!-- Open Graph (Réseaux Sociaux) -->
    <meta property="og:title" content="Chauffage énergie bois | Installation, Dépannage & Expertise">
    <meta property="og:description" content="Plus de 30 ans d'expérience en plomberie et chauffage. Choisissez votre service : dépannage/installation ou expertise.">
    <meta property="og:url" content="https://mon.projet-tri.org/MA/index.html">
    <meta property="og:type" content="website">


    <link rel="icon" type="image/png" href="https://mon.projet-tri.org/MA/favicon.png" sizes="32x32">
<link rel="shortcut icon" href="https://mon.projet-tri.org/MA/favicon.ico">

    <!-- Schema.org (Données structurées pour Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Plumber",
      "name": "Plomberie & Chauffage Expertise",
      "url": "https://votre-domaine.fr/splash.html",
      "description": "Entreprise spécialisée en travaux de plomberie, chauffage, dépannage, installation et expertise technique.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "FR"
      },
      "areaServed": "France"
    }
    </script>

    <style>
        :root {
            --run-color: #7da92b;
            --tri-color: #D65F3A;
            --text-dark: #111111;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* --- HEADER --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 0;
            text-align: center;
        }

        header h1 {
            color: var(--white);
            margin: 0;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            opacity: 0.95;
        }

        header h1 strong {
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- CONTAINER SPLIT --- */
        .splash-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: flex 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        /* IMAGE DE FOND */
        .side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('banniere-split.jpg');
            background-size: cover;
            filter: grayscale(10%) brightness(0.85);
            transition: all 0.8s ease;
            z-index: 1;
        }

        /* VOILE BLANC EN SURIMPRESSION */
        .side::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(2px);
            transition: all 0.5s ease;
            z-index: 2;
        }

        .side-tri::before { background-position: left center; }
        .side-run::before { background-position: right center; }

        /* CONTENU & ALIGNEMENT FLEXBOX PARFAIT */
        .content {
            position: relative;
            z-index: 3;
            color: var(--text-dark);
            padding: 40px 20px;
            width: 100%;
            max-width: 380px;
            transition: transform 0.5s ease;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ZONE LOGO : HAUTEUR FIXE POUR ALIGNER LES DEUX CÔTÉS */
        .logo-box {
            height: 170px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Alignement et résolution identiques pour les deux images */
        .logo-img {
            height: 110px;
            width: auto;
            max-width: 90%;
            margin: 0 auto 15px auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0px 0px 12px rgba(255, 255, 255, 0.9)) drop-shadow(0px 4px 10px rgba(0,0,0,0.15));
            transition: opacity 0.5s ease-in-out;
        }

        /* ZONE BOUTON : ALIGNÉ EN BAS */
        .btn-box {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            border: 2px solid var(--text-dark);
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* EFFET DE SURVOL ET DE MOUVEMENT */
        .side:hover { flex: 1.4; }
        .side:hover::before { filter: grayscale(0%) brightness(0.95) scale(1.05); }
        .side-tri:hover::before { background-position: left center; }
        .side-run:hover::before { background-position: right center; }
        .side:hover::after { background: rgba(255, 255, 255, 0.25); }
        .side:hover .content { transform: scale(1.05); }

        .side-tri:hover .btn { background: var(--tri-color); border-color: var(--tri-color); color: var(--white); }
        .side-run:hover .btn { background: var(--run-color); border-color: var(--run-color); color: var(--white); }

        /* OPTIMISATION MOBILE */
        @media (max-width: 834px) {
            header {
                position: relative;
                background: #000;
                padding: 15px 0;
                backdrop-filter: none;
                border-bottom: 2px solid #333;
            }

            header h1 { 
                font-size: 0.75rem; 
                padding: 0 15px; 
                line-height: 1.4; 
            }
            
            .splash-container { 
                flex-direction: column;
                height: calc(100vh - 60px);
            }
            
            .side {
                flex: 1;
                width: 100vw;
            }

            .side-tri::before { background-position: 20% center !important; }
            .side-run::before { background-position: 85% center !important; }

            .logo-box { height: 130px; }
            .logo-img { height: 80px; }

            .content { padding: 10px 20px; margin-top: 0; }
            .content h2 { font-size: 0.85rem; }
            
            .btn-box { margin-top: 15px; }
            .btn { 
                padding: 10px 25px; 
                font-size: 0.75rem;
            }
        }

        .logo-box h2 {
    margin: 12px 0 6px;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1.15;
}

.logo-box h3 {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
}
    </style>
</head>
<body>

    <header>
        <h1><strong>Spécialiste en énergie bois </strong>— Entreprise familiale et artisanale depuis 2005</h1>
    </header>

    <div class="splash-container">
        <!-- Lien - Dépannage & Installation -->
        <a href="index.html" onclick="redirectProject(event, 'specialiste')" class="side side-tri">
            <div class="content">
                <div class="logo-box">
    <img src="matthieu-artisan.specialiste.png" alt="Plomberie & Chauffage - Dépannage et Installation" class="logo-img">
    <h2>POÊLES À BOIS & À GRANULÉS</h2>
    <h3>INSTALLATION · MISE EN CONFORMITÉ</h3>
</div>
                <div class="btn-box">
                    <div class="btn">Accéder au site</div>
                </div>
            </div>
        </a>

        <!-- Lien - Expertise & Inspection -->
        <a href="expertise.html" onclick="redirectProject(event, 'expertise')" class="side side-run">
            <div class="content">
                <div class="logo-box">
    <img src="matthieu-artisan.expertise.2.png" alt="Expertise énergie bois" class="logo-img">
    <h2>EXPERTISE TECHNIQUE</h2>
    <h3>DIAGNOSTIC · MISSION DE SAPITEUR</h3>
</div>
                <div class="btn-box">
                    <div class="btn">Accéder au site</div>
                </div>
            </div>
        </a>
    </div>

<script>

function redirectProject(event, project) {
    if (event) {
        event.preventDefault();
    }

    const languages = navigator.languages || [navigator.language || navigator.userLanguage];
    
    const hasFrench = languages.some(lang => lang.toLowerCase().startsWith('fr'));
    const hasEnglish = languages.some(lang => lang.toLowerCase().startsWith('en'));
    const shouldGoToEn = !hasFrench && hasEnglish;

    if (project === 'specialiste') {
        window.location.href = shouldGoToEn ? 'poeles-bois-granules.html' : 'index.html';
    } else if (project === 'expertise') {
        window.location.href = shouldGoToEn ? 'expertise.html' : 'expertise.html';
    }
}
</script>
</body>
</html>
