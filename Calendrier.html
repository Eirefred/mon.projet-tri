<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier 2026 | Mon Projet Tri</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #f39200; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Style de la table */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.9em; }
        
        /* Liens et Badges */
        .event-link { color: var(--primary); font-weight: bold; text-decoration: none; border-bottom: 1px solid transparent; }
        .event-link:hover { border-bottom: 1px solid var(--accent); }
        .cp-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: bold; }
        .tq-logo { width: 20px; vertical-align: middle; margin-right: 8px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 10px; font-size: 0.7em; margin: 2px; background: #eee; }

        /* Style du Pop-up (Modal) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 80%; max-width: 600px; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 28px; cursor: pointer; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calendrier Triathlon 2026</h1>
    <div id="status" style="text-align:center; padding:20px;">Chargement du fichier...</div>

    <div class="table-container">
        <table id="calTable" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Événement</th>
                    <th>Région</th>
                    <th>Organisateur</th>
                    <th>Localisation</th>
                    <th>Distances</th>
                </tr>
            </thead>
            <tbody id="calBody"></tbody>
        </table>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeMap()">&times;</span>
        <h3 id="modalTitle">Emplacement de l'événement</h3>
        <div id="mapContainer"></div>
    </div>
</div>

<script>
    const EXCEL_FILE = 'Calendrier-2026.xlsx';
    const TQ_LOGO = "https://www.triathlonquebec.org/wp-content/uploads/2025/01/cropped-cropped-favicon_TQ-32x32-1-1-32x32.webp";

    async function loadExcel() {
        try {
            const response = await fetch(EXCEL_FILE);
            if (!response.ok) throw new Error();
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
            renderTable(data);
        } catch (e) {
            document.getElementById('status').innerHTML = "<b>Erreur :</b> Impossible de lire le fichier. Assurez-vous d'utiliser un serveur local ou que le fichier est en ligne.";
        }
    }

    function renderTable(data) {
        const body = document.getElementById('calBody');
        data.forEach(row => {
            if(!row["Événement"]) return;

            const tr = document.createElement('tr');
            
            // Logo TQ
            const tq = row["Affilié Triathlon Québec"] === "TQ" ? `<img src="${TQ_LOGO}" class="tq-logo">` : "";
            
            // Lien Site Web (Colonne E)
            const eventName = row["Site"] 
                ? `<a href="${row["Site"]}" target="_blank" class="event-link">${row["Événement"]}</a>` 
                : `<b>${row["Événement"]}</b>`;

            // Code Postal avec Pop-up (Colonne J)
            const cp = row["Code Postal"] ? row["Code Postal"].trim() : "";
            const mapHtml = cp 
                ? `<span class="cp-link" onclick="openMap('${cp}', '${row["Événement"].replace(/'/g, "\\'")}')">📍 ${cp}</span>` 
                : "-";

            // Distances
            let dists = [];
            ["Initiation", "Sprint", "Olympique", "Longue distance", "Distance complète", "Duathon Sprint", "Duathlon Olympique", "Aquavelo", "Aquathlon"].forEach(d => {
                if(row[d] === "X") dists.push(`<span class="badge">${d}</span>`);
            });

            tr.innerHTML = `
                <td>${row["Date (2026)"]}</td>
                <td>${tq}${eventName}</td>
                <td>${row["Région"]}</td>
                <td>${row["Club"]}</td>
                <td>${mapHtml}</td>
                <td>${dists.join("")}</td>
            `;
            body.appendChild(tr);
        });
        document.getElementById('status').style.display = 'none';
        document.getElementById('calTable').style.display = 'table';
    }

    // Gestion du Pop-up
    function openMap(cp, name) {
        const modal = document.getElementById('mapModal');
        const container = document.getElementById('mapContainer');
        document.getElementById('modalTitle').innerText = name;
        
        // On utilise l'embed de Google Maps pour le pop-up
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(cp)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
        container.innerHTML = `<iframe src="${mapUrl}"></iframe>`;
        modal.style.display = "block";
    }

    function closeMap() {
        document.getElementById('mapModal').style.display = "none";
        document.getElementById('mapContainer').innerHTML = ""; // Stop le chargement de l'iframe
    }

    // Fermer si on clique en dehors du cadre blanc
    window.onclick = function(event) {
        if (event.target == document.getElementById('mapModal')) closeMap();
    }

    window.onload = loadExcel;
</script>
</body>
</html>
