<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier 2026 | Mon Projet Tri</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #f39200; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        h1 { color: var(--primary); text-align: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; font-size: 0.85em; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.9em; }
        
        .btn-site { background: var(--primary); color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8em; display: inline-block; font-weight: bold; }
        .btn-site:hover { background: var(--accent); }
        .cp-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: bold; white-space: nowrap; }
        .tq-logo { width: 18px; vertical-align: middle; margin-right: 5px; }
        
        /* Badges regroupés par catégories */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75em; margin: 2px; font-weight: 500; border: 1px solid transparent; }
        .cat-tri { background: #e3f2fd; color: #1976d2; border-color: #bbdefb; } /* Triathlon */
        .cat-dua { background: #fff3e0; color: #e65100; border-color: #ffe0b2; } /* Duathlon */
        .cat-multi { background: #f3e5f5; color: #7b1fa2; border-color: #e1bee7; } /* Aquathlon/Velo */
        .cat-init { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; } /* Initiation */

        /* Modal Pop-up Carte */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: white; margin: 2% auto; padding: 20px; width: 90%; max-width: 900px; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 35px; cursor: pointer; color: #666; }
        iframe { width: 100%; height: 600px; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calendrier Triathlon & Duathlon 2026</h1>
    <div id="status" style="text-align:center; padding:20px;">Chargement du calendrier...</div>

    <div class="table-container">
        <table id="calTable" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Événement</th>
                    <th>Région</th>
                    <th>Club / Organisateur</th>
                    <th>Localisation</th>
                    <th>Site Web</th>
                    <th>Disciplines & Distances</th>
                </tr>
            </thead>
            <tbody id="calBody"></tbody>
        </table>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeMap()">&times;</span>
        <h3 id="modalTitle" style="margin-top:0; color:var(--primary);">Carte de l'événement</h3>
        <div id="mapContainer"></div>
    </div>
</div>

<script>
    const EXCEL_FILE = 'Calendrier-2026.xlsx';
    const TQ_LOGO = "https://www.triathlonquebec.org/wp-content/uploads/2025/01/cropped-cropped-favicon_TQ-32x32-1-1-32x32.webp";

    async function loadExcel() {
        try {
            const response = await fetch(EXCEL_FILE);
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            renderTable(rows);
        } catch (e) {
            document.getElementById('status').innerHTML = "Erreur : Impossible de charger le fichier Excel.";
        }
    }

    function renderTable(rows) {
        const body = document.getElementById('calBody');
        const headers = rows[0]; // La nouvelle ligne 1 (Initiation, Sprint...)

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row[1]) continue; 

            const tr = document.createElement('tr');
            
            // Colonne F (index 5) : Affiliation TQ
            const isTQ = row[5] === "TQ";
            const logo = isTQ ? `<img src="${TQ_LOGO}" class="tq-logo" title="Affilié TQ">` : "";

            // Colonne E (index 4) : Site Web
            const siteUrl = row[4] || "";
            const siteBtn = siteUrl ? `<a href="${siteUrl}" target="_blank" class="btn-site">Site Web</a>` : "-";

            // Colonne J (index 9) : Code Postal + Pop-up
            const cp = row[9] ? String(row[9]).trim() : "";
            const mapCell = cp ? `<span class="cp-link" onclick="openMap('${cp}', '${row[1].replace(/'/g, "\\'")}')">📍 ${cp}</span>` : "-";

            // Analyse des colonnes L à T (index 11 à 19) avec regroupement
            let badges = [];
            for (let j = 11; j <= 19; j++) {
                if (row[j] === "X" || row[j] === "x") {
                    const label = headers[j] || "";
                    let categoryClass = "cat-tri"; // Par défaut Triathlon

                    if (label.toLowerCase().includes("initiation")) categoryClass = "cat-init";
                    else if (label.toLowerCase().includes("duathlon")) categoryClass = "cat-dua";
                    else if (label.toLowerCase().includes("aqua")) categoryClass = "cat-multi";

                    badges.push(`<span class="badge ${categoryClass}">${label}</span>`);
                }
            }

            tr.innerHTML = `
                <td><b>${row[0] || ""}</b></td>
                <td>${logo} ${row[1]}</td>
                <td>${row[2] || ""}</td>
                <td><small>${row[6] || ""}</small></td>
                <td>${mapCell}</td>
                <td>${siteBtn}</td>
                <td>${badges.join("")}</td>
            `;
            body.appendChild(tr);
        }
        document.getElementById('status').style.display = 'none';
        document.getElementById('calTable').style.display = 'table';
    }

    function openMap(cp, name) {
        const modal = document.getElementById('mapModal');
        document.getElementById('modalTitle').innerText = name + " (" + cp + ")";
        
        // URL Google Maps avec marqueur (q=) et zoom (z=15)
        // L'iframe de Google Maps inclut naturellement les boutons +/-
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(cp)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        
        document.getElementById('mapContainer').innerHTML = `<iframe src="${mapUrl}" allowfullscreen></iframe>`;
        modal.style.display = "block";
    }

    function closeMap() {
        document.getElementById('mapModal').style.display = "none";
        document.getElementById('mapContainer').innerHTML = "";
    }

    window.onclick = (e) => { if (e.target.className === 'modal') closeMap(); }
    window.onload = loadExcel;
</script>
</body>
</html>
