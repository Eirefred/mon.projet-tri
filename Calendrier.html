<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier 2026 | Mon Projet Tri</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #f39200; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: var(--primary); text-align: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        
        .filters { margin: 20px 0; display: flex; gap: 10px; justify-content: center; }
        #search { padding: 12px; width: 100%; max-width: 400px; border-radius: 25px; border: 1px solid #ccc; outline: none; }

        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; font-size: 0.9em; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.9em; vertical-align: middle; }
        tr:hover { background-color: #fcfcfc; }

        .tq-logo { width: 22px; height: 22px; vertical-align: middle; margin-right: 5px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 0.75em; margin: 2px; font-weight: bold; }
        .badge-dist { background: #eef2f7; color: var(--primary); border: 1px solid #d1d9e6; }
        .map-link { color: var(--accent); text-decoration: none; font-weight: bold; white-space: nowrap; }
        .event-link { color: var(--primary); font-weight: bold; text-decoration: none; }
        .event-link:hover { text-decoration: underline; }
        .loading { text-align: center; padding: 50px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <p><a href="index.html" style="color: var(--primary); text-decoration: none;">← Retour à l'accueil</a></p>
    <h1>Calendrier Triathlon & Duathlon 2026</h1>

    <div class="filters">
        <input type="text" id="search" placeholder="Rechercher un événement, une région, un club..." onkeyup="filterTable()">
    </div>

    <div id="status" class="loading">Chargement du fichier Excel en cours...</div>

    <div class="table-container">
        <table id="calTable" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Événement</th>
                    <th>Région</th>
                    <th>Organisateur / Club</th>
                    <th>Localisation</th>
                    <th>Distances proposées</th>
                </tr>
            </thead>
            <tbody id="calBody"></tbody>
        </table>
    </div>
</div>

<script>
    const EXCEL_FILE = 'Calendrier-2026.xlsx';
    const TQ_LOGO = 'https://www.triathlonquebec.org/wp-content/uploads/2025/01/cropped-cropped-favicon_TQ-32x32-1-1-32x32.webp';

    async function loadExcel() {
        try {
            const response = await fetch(EXCEL_FILE);
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // On prend la première feuille
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Conversion en JSON (on commence à la ligne 1 car la ligne 0 est l'entête)
            const jsonData = XLSX.utils.sheet_to_json(worksheet);
            renderTable(jsonData);
        } catch (error) {
            document.getElementById('status').innerHTML = "Erreur de chargement. Vérifiez que le fichier 'Calendrier-2026.xlsx' est bien à la racine.";
            console.error(error);
        }
    }

    function renderTable(data) {
        const body = document.getElementById('calBody');
        body.innerHTML = "";

        data.forEach(row => {
            if(!row["Événement"]) return; // Sécurité

            const tr = document.createElement('tr');

            // Colonne F: Affiliation TQ
            const isTQ = row["Affilié Triathlon Québec"] === "TQ";
            const logoHtml = isTQ ? `<img src="${TQ_LOGO}" class="tq-logo" alt="TQ">` : "";

            // Colonne B & E: Nom et Site
            const eventLink = row["Site"] ? `<a href="${row["Site"]}" target="_blank" class="event-link">${row["Événement"]}</a>` : `<strong>${row["Événement"]}</strong>`;

            // Colonne J: Code Postal + Lien Carte
            const cp = row["Code Postal"] ? row["Code Postal"].trim() : "";
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cp)}`;
            const mapLink = cp ? `<a href="${mapUrl}" target="_blank" class="map-link">📍 ${cp}</a>` : "-";

            // Colonnes L et suivantes: Distances
            let distances = [];
            const types = ["Initiation", "Sprint", "Olympique", "Longue distance", "Distance complète", "Duathon Sprint", "Duathlon Olympique", "Aquavelo", "Aquathlon"];
            types.forEach(t => {
                if(row[t] === "X") distances.push(`<span class="badge badge-dist">${t}</span>`);
            });

            tr.innerHTML = `
                <td>${row["Date (2026)"] || ""}</td>
                <td>${logoHtml}${eventLink}</td>
                <td>${row["Région"] || ""}</td>
                <td><small>${row["Club"] || ""}</small></td>
                <td>${mapLink}</td>
                <td>${distances.join("")}</td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('status').style.display = 'none';
        document.getElementById('calTable').style.display = 'table';
    }

    function filterTable() {
        const query = document.getElementById("search").value.toLowerCase();
        const rows = document.querySelectorAll("#calBody tr");
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(query) ? "" : "none";
        });
    }

    window.onload = loadExcel;
</script>

</body>
</html>
