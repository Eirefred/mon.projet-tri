<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier 2026 | Mon Projet Tri</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #f39200; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        h1 { color: var(--primary); text-align: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; font-size: 0.85em; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.9em; }
        
        .btn-site { background: var(--primary); color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; display: inline-block; }
        .btn-site:hover { background: var(--accent); }
        .cp-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: bold; }
        .tq-logo { width: 18px; vertical-align: middle; margin-right: 5px; }
        
        /* Badges de distances */
        .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 0.75em; margin: 2px; font-weight: 500; }
        .badge-tri { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
        .badge-dua { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }
        .badge-autre { background: #f5f5f5; color: #616161; }

        /* Modal Pop-up */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 800px; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 28px; cursor: pointer; }
        iframe { width: 100%; height: 500px; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calendrier Triathlon & Duathlon 2026</h1>
    <div id="status" style="text-align:center; padding:20px;">Chargement du calendrier...</div>

    <div class="table-container">
        <table id="calTable" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Événement</th>
                    <th>Région</th>
                    <th>Club / Organisateur</th>
                    <th>Localisation</th>
                    <th>Site Web</th>
                    <th>Distances & Disciplines</th>
                </tr>
            </thead>
            <tbody id="calBody"></tbody>
        </table>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeMap()">×</span>
        <h3 id="modalTitle">Carte de l'événement</h3>
        <div id="mapContainer"></div>
    </div>
</div>

<script>
    const EXCEL_FILE = 'Calendrier-2026.xlsx';
    const TQ_LOGO = "https://www.triathlonquebec.org/wp-content/uploads/2025/01/cropped-cropped-favicon_TQ-32x32-1-1-32x32.webp";

    async function loadExcel() {
        try {
            const response = await fetch(EXCEL_FILE);
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // On convertit en matrice (tableau de tableaux) pour gérer les lignes 1 et 2
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            renderTable(rows);
        } catch (e) {
            document.getElementById('status').innerHTML = "Erreur de lecture du fichier Excel.";
        }
    }

    function renderTable(rows) {
        const body = document.getElementById('calBody');
        // Ligne 0 : Sports (Triathlon / Duathlon)
        // Ligne 1 : Distances / Entêtes
        const sports = rows[0]; 
        const headers = rows[1];
        
        // On commence à la ligne 2 pour les données
        for (let i = 2; i < rows.length; i++) {
            const row = rows[i];
            if (!row[1]) continue; // Skip si pas de nom d'événement

            const tr = document.createElement('tr');
            
            // Gestion TQ
            const isTQ = row[5] === "TQ";
            const logo = isTQ ? `<img src="${TQ_LOGO}" class="tq-logo">` : "";

            // Lien Site Web
            const siteUrl = row[4] || "";
            const siteBtn = siteUrl ? `<a href="${siteUrl}" target="_blank" class="btn-site">Visiter</a>` : "-";

            // Pop-up Carte
            const cp = row[9] ? String(row[9]).trim() : "";
            const mapCell = cp ? `<span class="cp-link" onclick="openMap('${cp}', '${row[1].replace(/'/g, "\\'")}')">📍 ${cp}</span>` : "-";

            // Analyse des distances (Colonnes L à T / Index 11 à 19)
            let badges = [];
            for (let j = 11; j <= 19; j++) {
                if (row[j] === "X" || row[j] === "x") {
                    let typeSport = (sports[j] || "").trim();
                    let distName = (headers[j] || "").trim();
                    let classBadge = "badge-autre";
                    
                    if(typeSport.includes("Triathlon")) classBadge = "badge-tri";
                    if(typeSport.includes("Duathlon")) classBadge = "badge-dua";
                    
                    badges.push(`<span class="badge ${classBadge}">${typeSport} ${distName}</span>`);
                }
            }

            tr.innerHTML = `
                <td>${row[0] || ""}</td>
                <td>${logo}<strong>${row[1]}</strong></td>
                <td>${row[2] || ""}</td>
                <td><small>${row[6] || ""}</small></td>
                <td>${mapCell}</td>
                <td>${siteBtn}</td>
                <td>${badges.join("")}</td>
            `;
            body.appendChild(tr);
        }
        document.getElementById('status').style.display = 'none';
        document.getElementById('calTable').style.display = 'table';
    }

    function openMap(cp, name) {
        const modal = document.getElementById('mapModal');
        document.getElementById('modalTitle').innerText = name;
        const mapUrl = `http://googleusercontent.com/maps.google.com/3{encodeURIComponent(cp)}&output=embed`;
        document.getElementById('mapContainer').innerHTML = `<iframe src="${mapUrl}"></iframe>`;
        modal.style.display = "block";
    }

    function closeMap() {
        document.getElementById('mapModal').style.display = "none";
        document.getElementById('mapContainer').innerHTML = "";
    }

    window.onclick = (e) => { if (e.target.className === 'modal') closeMap(); }
    window.onload = loadExcel;
</script>
</body>
</html>
